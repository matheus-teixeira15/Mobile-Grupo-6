<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-img src="/assets/imgs/pokemon_logo.png"></ion-img>
    <ion-title class="ion-text-center">
      Conheça novos <br>
      Pokémon!
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-refresher slot="fixed" (ionPull)="false" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (!loading) {
    <ion-list>
      @for (pokemon of pokemons; track pokemon) {
        <ion-card (click)="verStats(pokemon)"> <!-- Cria um ion-item pra cada pokémon obtido da API -->
          <img [src]="pokemon.sprites.front_default" alt="{{ pokemon.name }}" loading="lazy"/>
          <ion-card-header>
            <ion-card-title>
              {{ pokemon.name | titlecase }}
            </ion-card-title>
            <ion-card-subtitle>
              Type: {{ pokemon.types[0].type.name }}
            </ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      }
    </ion-list>
  }

</ion-content>

<ion-footer>
  <ion-tab-bar slot="bottom">
    <ion-tab-button routerLink="/feed" routerLinkActive="tab-selected">
      <ion-icon name="home"></ion-icon>
      <ion-label>Feed</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/pesquisa" routerLinkActive="tab-selected">
      <ion-icon name="search"></ion-icon>
      <ion-label>Pesquisa</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/conta" routerLinkActive="tab-selected">
      <ion-icon name="person"></ion-icon>
      <ion-label>Conta</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
