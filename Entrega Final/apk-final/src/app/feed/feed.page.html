<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-img src="/assets/imgs/pokemon_logo.png"></ion-img>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-refresher slot="fixed" (ionPull)="false" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="!loading"> 
    <ion-card *ngFor="let pokemon of pokemons"> <!-- Cria um ion-item pra cada pokémon obtido da API -->
      <img [src]="pokemon.sprites.front_default" alt="{{ pokemon.name }}" loading="lazy"/>
      <ion-card-header>
        <ion-card-title>
          {{ pokemon.name | titlecase }}
        </ion-card-title>
        <ion-card-subtitle>
          Tipo: {{ pokemon.types[0].type.name }}
        </ion-card-subtitle>
      </ion-card-header>
    </ion-card>
  </ion-list>
  
</ion-content>
