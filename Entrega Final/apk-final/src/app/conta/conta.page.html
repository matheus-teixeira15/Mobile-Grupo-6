<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-img src="/assets/imgs/pokemon_logo.png"></ion-img>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="!isLoggedIn">


  <div id="login-container">
    <div id="email" class="input">
      <ion-input
        placeholder="Email"
        [(ngModel)]="email"
        type="email">
      </ion-input>
    </div>
    <div id="senha" class="input">
      <ion-input
        placeholder="Senha"
        [(ngModel)]="password"
        type="password"
      ></ion-input>
    </div>
    <ion-button expand="block" (click)="isCreatingAccount ? register() : login()">
      {{ isCreatingAccount ? 'Criar Conta' : 'Entrar' }}
    </ion-button>
    <ion-button expand="block" fill="clear" (click)="toggleForm()">
      {{ isCreatingAccount ? 'Já tenho conta' : 'Criar nova conta' }}
    </ion-button>
  </div>


</ion-content>


<ion-content [fullscreen]="true" *ngIf="isLoggedIn">


  <div class="margin_container">
    <div id="user-container">
      <ul>
        <li><a>Meus Favoritos</a></li>
        <li><a href="https://pokeapi.co/" target="_blank">Api Utilizada</a></li>
        <li><a href="https://pokemon.fandom.com/wiki/Pok%C3%A9mon" target="_blank">Wiki</a></li>
        <li><a href="https://github.com/matheus-teixeira15/Mobile-Grupo-6" target="_blank">Repositório do Projeto</a></li>
        <li><a href="https://www.youtube.com/watch?v=kkQPwEfmWwc" target="_blank">O melhor trio</a></li>
      </ul>
      <ion-button (click)="logout()">
        Sair
      </ion-button>
    </div>
  </div>


</ion-content>



<ion-footer>
  <ion-tab-bar slot="bottom">
    <ion-tab-button routerLink="/feed" routerLinkActive="tab-selected">
      <ion-icon name="home"></ion-icon>
      <ion-label>Feed</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/pesquisa" routerLinkActive="tab-selected">
      <ion-icon name="search"></ion-icon>
      <ion-label>Pesquisa</ion-label>
    </ion-tab-button>

    <ion-tab-button routerLink="/conta" routerLinkActive="tab-selected">
      <ion-icon name="person"></ion-icon>
      <ion-label>Conta</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
